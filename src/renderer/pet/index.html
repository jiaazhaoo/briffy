<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' file: data:; font-src 'self' file:" />
  <title>briffy Pet</title>
  <link rel="stylesheet" href="../../../assets/fonts/fonts.css" />
  <link rel="stylesheet" href="../../../assets/paper/tokens.css" />
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="pet" class="pet state-idle" title="单击截图 · 双击框选 · 中键或长按录音 · 拖入文件存入工作区 · 右键菜单">
    <div class="float">
      <div class="frame">
        <img class="avatar" src="../../../assets/pet/avatar.png" alt="" draggable="false" />
        <!-- briffy drawing itself, when the frame still holds briffy. Same box as the <img>, so the
             peek gesture moves either one. See assets/brand/briffy-anim.js -->
        <div class="avatar live"></div>
        <div class="flash"></div>
      </div>
      <div class="ring"></div>
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="badge"></div>
    </div>
  </div>
  <script src="../../../assets/brand/briffy-anim.js"></script>
  <script src="pet.js"></script>
</body>
</html>
