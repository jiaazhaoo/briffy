<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<title>briffy · 配色对照</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css" />
<style>
/* 新旧两套颜色摆在一起看。左边是现在的，右边是提案。
   卡片是真的六种卡片（简化版），墨阶和对比度是页面自己算出来的，不是我打上去的。

   提案的三处依据（2026-09-05 调研）：
     1 暗色下卡片几乎融进背景：底纸→纸只差 5.9 L*，亮色是 17.6
     2 「铅笔」这一级 3.1:1 / 3.3:1，低于 WCAG AA 的 4.5
     3 三级墨步长 39 / 14 / 36，两个淡墨挤在一起，都离黑很远
   参照：Steidl 的黑是 #333（L*21）不是纯黑；are.na 暗色底 #1a1a1a、卡面 #333，差 11 L* */

.pal-now  { --page:#c9c8c5; --slip:#fafaf9; --slip-2:#efefed; --ink:#1a1a19; --ink-2:#6a6a67; --ink-3:#8e8e8a;
  --evid:#43433e; --p-note:#fbf5d8; --p-note-2:#ece1ae; --accent:#2f4f7a; --stamp:#bc4032; --marker:#f2e9a8;
  --e1: 0 1px 1px rgba(0,0,0,.10), 0 4px 10px rgba(0,0,0,.10); }
.pal-new  { --page:#d3d1d0; --slip:#fbf9f8; --slip-2:#f0eeed; --ink:#32302f; --ink-2:#52504f; --ink-3:#747271;
  --evid:#494746; --p-note:#fbf6dc; --p-note-2:#ece2b4; --accent:#3c5470; --stamp:#b2503f; --marker:#f2e9a8;
  --e1: 0 1px 1px rgba(0,0,0,.09), 0 4px 10px rgba(0,0,0,.09); }
.pal-now.dark { --page:#17191d; --slip:#23262c; --slip-2:#2b2f36; --ink:#e6e6e3; --ink-2:#a0a09c; --ink-3:#757572;
  --evid:#5c5c55; --p-note:#2e2a1e; --p-note-2:#3b3423; --accent:#8fadd8; --stamp:#e0705f; --marker:#3a3728;
  --e1: 0 1px 1px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.4); }
.pal-new.dark { --page:#1b1918; --slip:#32302f; --slip-2:#3d3b3a; --ink:#eae8e7; --ink-2:#bbb9b8; --ink-3:#989695;
  --evid:#797776; --p-note:#3a3526; --p-note-2:#474030; --accent:#93a8c6; --stamp:#d17f72; --marker:#3f3a2a;
  --e1: 0 1px 1px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.4); }

:root { --sans: "Source Sans 3", "Noto Sans SC", -apple-system, "PingFang SC", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 32px; background: #b9b7b4; color: #1a1a19;
  font: 400 13px/1.6 var(--sans); -webkit-font-smoothing: antialiased; text-autospace: normal; }
h1 { font: 600 21px/1.3 var(--sans); margin: 0 0 4px; }
.lede { color: #56544f; margin: 0 0 28px; max-width: 60em; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.pal { padding: 22px; background: var(--page); color: var(--ink); }
.pal h2 { font: 600 13px/1.4 var(--sans); margin: 0 0 18px; color: var(--ink-2); }
.pal h2 em { font-style: normal; color: var(--ink-3); font-weight: 400; margin-left: 8px; }

/* ---- 六种卡片（简化，但物证和墨色都照真的来） ---- */
.cards { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.c { position: relative; background: var(--slip); box-shadow: var(--e1); }
.tm { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }

.c-voice { width: 250px; height: 118px; padding: 14px; }
.c-voice .said { position: absolute; left: 14px; right: 14px; top: 34px; bottom: 38px; color: var(--ink-2);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.c-voice .tape { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: var(--evid); }
.c-voice .tape::before, .c-voice .tape::after { content: ''; position: absolute; top: 10px; width: 10px; height: 10px; background: var(--slip); }
.c-voice .tape::before { left: 16px; } .c-voice .tape::after { left: 34px; }
.c-voice .dur { position: absolute; right: 14px; bottom: 8px; color: var(--slip); opacity: .85; font-size: 11px; }

.c-shot { width: 150px; height: 118px; padding: 8px 8px 0; }
.c-shot .pic { position: absolute; left: 8px; top: 8px; width: calc(100% - 16px); height: calc(100% - 38px);
  background: var(--slip-2); box-shadow: inset 0 0 0 1px rgba(0,0,0,.07); }
.c-shot .tm { position: absolute; left: 10px; bottom: 8px; }

.c-note { width: 118px; height: 118px; padding: 18px; background: var(--p-note); }
.c-note .said { font-size: 15px; line-height: 1.7; color: var(--ink);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.c-note .tm { position: absolute; left: 18px; bottom: 16px; }
.c-note .fold { position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; background: var(--p-note-2);
  clip-path: polygon(100% 0, 100% 100%, 0 100%); filter: drop-shadow(-1px -1px 1.5px rgba(0,0,0,.16)); }

.c-mark { width: 210px; height: 118px; padding: 14px 14px 14px 38px; display: flex; flex-direction: column; justify-content: center; }
.c-mark .ribbon { position: absolute; left: 14px; top: 0; width: 13px; height: 58%;
  background: var(--evid); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); }
.c-mark .ttl { font: 600 15px/1.45 var(--sans); color: var(--ink); }
.c-mark .host { margin-top: 3px; color: var(--ink-3); font-size: 11px; }
.c-mark .tm { position: absolute; right: 14px; top: 14px; }

.c-clip { width: 140px; height: 118px; padding: 22px 10px 26px; background: var(--slip); box-shadow: none;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.10)) drop-shadow(0 4px 10px rgba(0,0,0,.10));
  clip-path: polygon(0 9px, 5% 1px, 9% 7px, 16% 11px, 22% 2px, 27% 5px, 34% 12px, 39% 3px, 46% 8px, 51% 1px, 57% 10px,
    63% 4px, 70% 12px, 75% 2px, 81% 6px, 88% 11px, 94% 3px, 100% 8px,
    100% calc(100% - 4px), 95% calc(100% - 11px), 89% calc(100% - 2px), 83% calc(100% - 7px), 77% calc(100% - 12px),
    71% calc(100% - 3px), 64% calc(100% - 9px), 58% calc(100% - 1px), 52% calc(100% - 11px), 46% calc(100% - 5px),
    39% calc(100% - 12px), 33% calc(100% - 2px), 27% calc(100% - 8px), 20% calc(100% - 11px), 14% calc(100% - 3px),
    8% calc(100% - 9px), 3% calc(100% - 1px), 0 calc(100% - 7px)); }
.c-clip .q { color: var(--ink-2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.c-clip .tm { position: absolute; right: 10px; bottom: 6px; }

.c-file { width: 175px; height: 118px; padding: 14px 14px 14px 28px; }
.c-file::before, .c-file::after { content: ''; position: absolute; left: 8px; width: 12px; height: 12px;
  background: var(--page); box-shadow: inset 0 1px 1px rgba(0,0,0,.16); }
.c-file::before { top: 30%; } .c-file::after { bottom: 30%; }
.c-file b { display: block; font-weight: 600; color: var(--ink); }
.c-file .host { color: var(--ink-3); font-size: 11px; }

/* ---- 墨阶 ---- */
.ladder { margin-top: 22px; display: flex; gap: 0; }
.step { flex: 1; }
.step i { display: block; height: 40px; }
.step span { display: block; margin-top: 5px; font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nums { margin-top: 14px; font-size: 11px; line-height: 1.9; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nums b { color: var(--ink); font-weight: 600; }
.bad { color: var(--stamp); font-weight: 600; }
.ok { color: var(--ink); font-weight: 600; }
.dark-row { margin-top: 26px; }
</style>
</head>
<body>
<h1>配色对照</h1>
<p class="lede">左边是现在这套，右边是提案。卡片、墨阶都是真的；下面那几行对比度是页面自己算的。
判断标准：暗色下卡片要能从底纸上分出来（明度差 ≥ 10 L*），「铅笔」这一级要够到 WCAG AA 的 4.5:1，三级墨的步长要匀。</p>

<div class="cols" id="cols"></div>

<script>
const CARDS = `
  <div class="cards">
    <article class="c c-voice"><span class="tm">10:03</span>
      <div class="said">你好，这是一段测试录音。明天上午记得把项目预算发给张老师。</div>
      <div class="tape"></div><span class="dur">1′04″</span></article>
    <article class="c c-shot"><span class="pic"></span><span class="tm">09:12</span></article>
    <article class="c c-note"><div class="said">明天上午十点和产品团队开会</div><span class="tm">15:02</span><span class="fold"></span></article>
    <article class="c c-mark"><span class="ribbon"></span><span class="tm">11:25</span>
      <div class="ttl">为什么 SQLite 不需要服务器</div><div class="host">example.com</div></article>
    <article class="c c-clip"><div class="q">“后端联调排在本周四，前端先按 mock 走。”</div><span class="tm">12:15</span></article>
    <article class="c c-file"><span class="tm">13:40</span><b>第三季度预算.pdf</b><span class="host">files/q3.pdf</span></article>
  </div>`;

function lin(x) { x /= 255; return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }
function lum(hex) { const n = parseInt(hex.slice(1), 16); return 0.2126 * lin(n >> 16 & 255) + 0.7152 * lin(n >> 8 & 255) + 0.0722 * lin(n & 255); }
function ct(a, b) { const x = lum(a), y = lum(b); return ((Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05)); }
function lstar(hex) { const y = lum(hex); return y > 0.008856 ? 116 * Math.cbrt(y) - 16 : 903.3 * y; }

function panel(cls, title, note) {
  const el = document.createElement('div');
  el.className = 'pal ' + cls;
  el.innerHTML = `<h2>${title}<em>${note}</em></h2>` + CARDS
    + `<div class="ladder"></div><div class="nums"></div>`;
  return el;
}
const cols = document.getElementById('cols');
for (const [cls, title] of [['pal-now', '现在'], ['pal-new', '提案']]) cols.appendChild(panel(cls, title, '日光'));
for (const [cls, title] of [['pal-now dark', '现在'], ['pal-new dark', '提案']]) {
  const p = panel(cls, title, '暗色'); p.classList.add('dark-row'); cols.appendChild(p);
}
// 墨阶和数字：从每一栏自己的变量里读出来算，不是打上去的
for (const pal of document.querySelectorAll('.pal')) {
  const g = (n) => getComputedStyle(pal).getPropertyValue('--' + n).trim();
  const steps = [['底纸', 'page'], ['纸', 'slip'], ['铅笔', 'ink-3'], ['淡墨', 'ink-2'], ['墨', 'ink'], ['物证', 'evid']];
  pal.querySelector('.ladder').innerHTML = steps.map(([nm, k]) =>
    `<div class="step"><i style="background:${g(k)}"></i><span>${nm} L*${lstar(g(k)).toFixed(0)}</span></div>`).join('');
  const paper = g('slip'), page = g('page');
  const row = (nm, v, want, higher) => {
    const good = higher ? v >= want : v <= want;
    return `${nm} <b class="${good ? 'ok' : 'bad'}">${v.toFixed(1)}</b>`;
  };
  const dl = Math.abs(lstar(paper) - lstar(page));
  pal.querySelector('.nums').innerHTML =
    `底纸→纸 明度差 <b class="${dl >= 10 ? 'ok' : 'bad'}">${dl.toFixed(1)} L*</b>（要 ≥ 10，否则卡片融进背景）<br>`
    + `${row('铅笔对比', ct(paper, g('ink-3')), 4.5, true)}（WCAG AA 要 ≥ 4.5）　`
    + `${row('淡墨', ct(paper, g('ink-2')), 4.5, true)}　${row('墨', ct(paper, g('ink')), 4.5, true)}<br>`
    + `三级墨步长 <b>${Math.abs(lstar(g('ink-3')) - lstar(g('ink-2'))).toFixed(0)}</b> / <b>${Math.abs(lstar(g('ink-2')) - lstar(g('ink'))).toFixed(0)} L*</b>（要相近）　`
    + `纸→物证 <b>${Math.abs(lstar(paper) - lstar(g('evid'))).toFixed(0)} L*</b>`;
}
</script>
</body>
</html>
